<div class="stats">
    <p>Cookies: <span id="cookies">0</span></p>
    <p>Cookies por clique: <span id="cpc">1</span></p>
</div>

<div class="upgrades">
    <h2>Upgrades</h2>
    <button class="upgrade-button" id="upgrade1">Forno (+1 CPC) - 10 cookies</button>
    <button class="upgrade-button" id="upgrade2">Chef (+5 CPC) - 50 cookies</button>
</div>

<script>
    let cookies = 0;
    let cookiesPerClick = 1;

    const cookie = document.getElementById('cookie');
    const cookiesDisplay = document.getElementById('cookies');
    const cpcDisplay = document.getElementById('cpc');

    // Atualiza a exibição de cookies
    function updateDisplay() {
        cookiesDisplay.textContent = cookies;
        cpcDisplay.textContent = cookiesPerClick;
    }

    // Clique no cookie
    cookie.addEventListener('click', () => {
        cookies += cookiesPerClick;
        updateDisplay();
    });

    // Upgrade 1 - Forno
    document.getElementById('upgrade1').addEventListener('click', () => {
        if (cookies >= 10) {
            cookies -= 10;
            cookiesPerClick += 1;
            updateDisplay();
        } else {
            alert("Você não tem cookies suficientes!");
        }
    });

    // Upgrade 2 - Chef
    document.getElementById('upgrade2').addEventListener('click', () => {
        if (cookies >= 50) {
            cookies -= 50;
            cookiesPerClick += 5;
            updateDisplay();
        } else {
            alert("Você não tem cookies suficientes!");
        }
    });

    updateDisplay();
</script>
